name: Release

# Push a tag like v1.0.0 to build the plugin ZIP and publish it as a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Run tests and build plugin ZIP
        run: ./gradlew test buildPlugin

      - name: Check that the tag matches the plugin version
        run: |
          plugin_version="${GITHUB_REF_NAME#v}"
          plugin_zip="build/distributions/json-log-lens-${plugin_version}.zip"
          if [ ! -f "$plugin_zip" ]; then
            echo "::error::Expected $plugin_zip. Does 'version' in build.gradle.kts match the tag $GITHUB_REF_NAME?"
            ls build/distributions
            exit 1
          fi
          echo "PLUGIN_ZIP=$plugin_zip" >> "$GITHUB_ENV"

      - name: Create GitHub release with the plugin ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$PLUGIN_ZIP" --title "JSON Log Lens $GITHUB_REF_NAME" --generate-notes
